# Pumpcast — docker compose up -d --build
#
# Listens on 127.0.0.1 only: put it behind a reverse proxy with HTTPS (Nginx Proxy Manager,
# Caddy, Traefik...), a Cloudflare Tunnel, or reach it through a VPN such as Tailscale.
# Solo escucha en 127.0.0.1: ponla detrás de un proxy inverso con HTTPS, de un túnel de
# Cloudflare o de una VPN.
services:
  pumpcast:
    build:
      context: .
      args:
        VERSION: "2.15.0"
    image: pumpcast:2.15.0
    container_name: pumpcast
    restart: unless-stopped
    user: "1000:1000"            # owner of ./data (check with `id -u`) / dueño de ./data
    ports:
      - "127.0.0.1:8098:8000"
    environment:
      - TZ=Europe/Madrid
      # Optional / Opcional:
      # - ADMIN_PASSWORD_HASH=scrypt:...             # admin panel (/admin): see README / ver README
      # - TITULAR=Your name                          # legal notice (/legal) / aviso legal
      # - CONTACTO=you@example.com
      # - ATAJO_ICLOUD=https://www.icloud.com/shortcuts/...   # ready-made Siri shortcut for /voz
      # - ATAJO_COMBUSTIBLE=g95                               # ...and what it comes set up with
      # - ATAJO_MAPA=waze
      # - APP_URL=https://pumpcast.example.com       # link added to Telegram alerts
      # - TELEGRAM_TOKEN=123456:ABC...               # bot from @BotFather
      # - TELEGRAM_CHAT=123456789                    # your chat id
      # - COPIAS_DIR=/app/copias                     # daily DB backup (needs a .pumpcast-copias file there)
    volumes:
      - ./data:/app/data
      # - /other/disk/pumpcast-backups:/app/copias
    # Hardening / Endurecimiento: read-only filesystem, no extra privileges.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 384m
