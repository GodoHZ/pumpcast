# Pumpcast — docker compose up -d --build
#
# Listens on 127.0.0.1 only: put it behind a reverse proxy with HTTPS (Nginx Proxy
# Manager, Caddy, Traefik...) or reach it through a VPN such as Tailscale.
# Solo escucha en 127.0.0.1: ponla detrás de un proxy inverso con HTTPS o de una VPN.
services:
  pumpcast:
    build:
      context: .
      args:
        VERSION: "1.3.0"
    image: pumpcast:1.3.0
    container_name: pumpcast
    restart: unless-stopped
    user: "1000:1000"            # owner of ./data (check with `id -u`) / dueño de ./data
    ports:
      - "127.0.0.1:8098:8000"
    environment:
      - TZ=Europe/Madrid
      # Optional / Opcional:
      # - PROVINCIAS=28                              # starting province (INE code), then in Settings
      # - APP_URL=https://pumpcast.example.com    # link added to Telegram alerts
      # - TELEGRAM_TOKEN=123456:ABC...               # bot from @BotFather
      # - TELEGRAM_CHAT=123456789                    # your chat id
    volumes:
      - ./data:/app/data
    mem_limit: 256m
