{% extends "base.html" %}
{% block titulo %}{{ t("admin.titulo") }} · Pumpcast{% endblock %}
{% block h1 %}{{ t("admin.titulo") }}{% endblock %}
{% block contenido %}
{% if error %}<p class="mensaje error">{{ t(error) }}</p>{% endif %}
<form method="post" action="/admin/entrar" class="formulario tarjeta">
  <label>{{ t("admin.clave") }}<input name="clave" type="password" autocomplete="current-password" required autofocus></label>
  {% if con_codigo %}
  <label>{{ t("admin.codigo") }}<input name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required></label>
  {% endif %}
  <button class="boton ancho">{{ t("admin.entrar") }}</button>
</form>
{% endblock %}
